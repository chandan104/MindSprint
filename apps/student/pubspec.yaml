name: mindsprint_student
description: "Skill Lab student app — teacher-supervised cognitive assessments."
publish_to: 'none'

version: 0.5.2+10

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  supabase_flutter: ^2.8.0
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  uuid: ^4.4.0
  connectivity_plus: ^7.0.0
  flutter_secure_storage: ^9.2.0
  crypto: ^3.0.3
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.0
  mocktail: ^1.0.0
  fake_async: ^1.3.0
  sqlite3: ^2.4.0
  flutter_launcher_icons: ^0.14.1

# Launcher icon generation (run: dart run flutter_launcher_icons).
# Drop the square Skill Lab logo (>=1024x1024 PNG) at the image_path below,
# then run the command to regenerate Android/iOS launcher icons.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/skill_lab_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/skill_lab_logo.png"

flutter:
  uses-material-design: true
